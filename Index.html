<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const supabase = window.supabase.createClient(
    'https://VOTRE-PROJET.supabase.co',
    'VOTRE-CLE-ANON-PUBLIC'
  );

  async function loadFromDb(){
    const { data } = await supabase.from('app_storage').select('value').eq('id','family-carpool-data').maybeSingle();
    return data ? data.value : null;
  }
  async function saveToDb(value){
    await supabase.from('app_storage').upsert({ id:'family-carpool-data', value });
  }
</script>
